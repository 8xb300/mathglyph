# Publishes to npm when a tag like v0.6.1 is pushed.
# It uses npm trusted publishing (OIDC), so the repo holds no npm token.
# It works only after the owner adds this repo as a trusted publisher on npmjs.com:
#   package mathglyph > Settings > Trusted Publisher > GitHub Actions
#   organization or user: 8xb300, repository: mathglyph, workflow filename: release.yml
# For the first publish, the package must exist on npm already. Publish once by hand with a token.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer. Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm install
      - run: npm run build
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Check that dist/ is committed and current
        run: git diff --exit-code -- dist
      - name: Check that the package imports
        run: |
          npm pack --silent
          dir="$(mktemp -d)"
          cp mathglyph-*.tgz "$dir"
          cd "$dir"
          npm init -y > /dev/null
          npm install ./mathglyph-*.tgz
          node --input-type=module -e "import { mount } from 'mathglyph'; import { ring } from 'mathglyph/layouts/ring'; import { greek } from 'mathglyph/languages'; if (typeof mount !== 'function' || !ring || !greek) process.exit(1)"
      - run: npm publish --provenance --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
